[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyquest"
version = "0.1"
description = "Python lessons that read themselves aloud, run your code in a sandbox, and yell at you when you forget a comma."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["python", "learning", "education", "tutor", "tts", "kokoro", "lmstudio", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Runtime dependencies. Major versions pinned so users get a known-good combo;
# minor/patch updates allowed via the >= form for security fixes.
dependencies = [
    "PySide6>=6.6,<7",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "sounddevice>=0.4.6,<1",
    "soundfile>=0.12.1,<1",
    "numpy>=1.24,<3",
    "vosk>=0.3.45,<0.4",
    "kokoro-onnx>=0.4.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.5,<1",
]

[project.urls]
Homepage = "https://github.com/AhmedBoSaad/PyQuest"
Source = "https://github.com/AhmedBoSaad/PyQuest"
Issues = "https://github.com/AhmedBoSaad/PyQuest/issues"
Changelog = "https://github.com/AhmedBoSaad/PyQuest/blob/main/CHANGELOG.md"

[project.scripts]
pyquest = "pyquest.app:main"

[tool.setuptools.packages.find]
include = ["pyquest*"]

[tool.setuptools.package-data]
pyquest = ["data/**/*.json", "data/**/*.md", "data/fonts/*.ttf", "data/fonts/*.otf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
