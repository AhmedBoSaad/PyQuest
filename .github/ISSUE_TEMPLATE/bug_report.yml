name: 🐛 Bug report
description: Something broke or behaved unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! The fastest path: click **Report a bug** inside PyQuest (Settings → About). It pre-fills this form with your recent log tail.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: Describe the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: Describe the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PyQuest version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11, macOS 14.5, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.11.9
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log tail
      placeholder: Paste the last 40 lines of userdata/logs/pyquest.log
      render: text
