name: ✨ Feature request
description: Suggest an idea, new lesson, new persona, etc.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      placeholder: What should PyQuest do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      placeholder: What problem does this solve / what does it improve?
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - New lesson
        - Tutor persona
        - UI / UX
        - Voice / speech
        - Sandbox / safety
        - Other
