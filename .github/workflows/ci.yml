name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & lint (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux audio deps (PortAudio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies (test subset)
        # The UI deps (PySide6, sounddevice, kokoro-onnx, vosk) aren't needed
        # for the pure-Python unit tests we run in CI. We install python-dotenv
        # because pyquest.config imports it at import-time.
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv pytest ruff

      - name: Lint
        run: ruff check pyquest

      - name: Tests
        run: pytest -q
